name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build client
        run: pyinstaller citywar-client.spec --noconfirm --clean

      - name: Build server
        run: pyinstaller citywar-server.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          zip city-war-client-macos.zip citywar-client
          zip city-war-server-macos.zip citywar-server

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-war-client-macos
          path: dist/city-war-client-macos.zip

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-war-server-macos
          path: dist/city-war-server-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build client
        run: pyinstaller citywar-client.spec --noconfirm --clean

      - name: Build server
        run: pyinstaller citywar-server.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          Compress-Archive -Path citywar-client.exe -DestinationPath city-war-client-windows.zip
          Compress-Archive -Path citywar-server.exe -DestinationPath city-war-server-windows.zip

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-war-client-windows
          path: dist/city-war-client-windows.zip

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-war-server-windows
          path: dist/city-war-server-windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect zip files
        run: find ./artifacts -name '*.zip' -exec mv {} ./artifacts/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
