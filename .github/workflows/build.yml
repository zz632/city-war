name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build client
        run: pyinstaller citywar-client.spec --noconfirm --clean

      - name: Build server
        run: pyinstaller citywar-server.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          zip city-war-client-macos-arm64.zip citywar-client
          zip city-war-server-macos-arm64.zip citywar-server

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: macos-client-arm64
          path: dist/city-war-client-macos-arm64.zip

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: macos-server-arm64
          path: dist/city-war-server-macos-arm64.zip

  build-macos-x64:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build client
        run: pyinstaller citywar-client.spec --noconfirm --clean

      - name: Build server
        run: pyinstaller citywar-server.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          zip city-war-client-macos-x64.zip citywar-client
          zip city-war-server-macos-x64.zip citywar-server

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: macos-client-x64
          path: dist/city-war-client-macos-x64.zip

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: macos-server-x64
          path: dist/city-war-server-macos-x64.zip

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build client
        run: pyinstaller citywar-client.spec --noconfirm --clean

      - name: Build server
        run: pyinstaller citywar-server.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          Compress-Archive -Path citywar-client.exe -DestinationPath city-war-client-windows-universal.zip
          Compress-Archive -Path citywar-server.exe -DestinationPath city-war-server-windows-universal.zip

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: city-war-client-windows-universal
          path: dist/city-war-client-windows-universal.zip

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: city-war-server-windows-universal
          path: dist/city-war-server-windows-universal.zip

  build-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GTK for pywebview)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-webkit2-4.1 libglib2.0-dev libcairo2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build client
        run: pyinstaller citywar-client.spec --noconfirm --clean

      - name: Build server
        run: pyinstaller citywar-server.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          tar czf city-war-client-linux-x64.tar.gz citywar-client
          tar czf city-war-server-linux-x64.tar.gz citywar-server

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: city-war-client-linux-x64
          path: dist/city-war-client-linux-x64.tar.gz

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: city-war-server-linux-x64
          path: dist/city-war-server-linux-x64.tar.gz

  release:
    needs: [build-macos-arm64, build-macos-x64, build-windows, build-linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect archives
        run: find ./artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} ./artifacts/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.*
          generate_release_notes: true
