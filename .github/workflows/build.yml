name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        run: pyinstaller citywar.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          zip city-war-launcher-macos.zip citywar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-war-launcher-macos
          path: dist/city-war-launcher-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        run: pyinstaller citywar.spec --noconfirm --clean

      - name: Package
        run: |
          cd dist
          Compress-Archive -Path citywar.exe -DestinationPath city-war-launcher-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-war-launcher-windows
          path: dist/city-war-launcher-windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: city-war-launcher-macos
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: city-war-launcher-windows
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
