<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>世界底图预览</title>
<style>
html,body{margin:0;height:100%;background:#a6cbe2;overflow:hidden}
#cv{display:block;cursor:grab;touch-action:none}
#hud{position:fixed;top:12px;left:12px;background:rgba(250,249,244,.93);border:1px solid #b5b0a4;
padding:7px 12px;font:13px/1.6 "Songti SC","STSong","SimSun",serif;color:#26241f;pointer-events:none;letter-spacing:.5px}
#tip{position:fixed;display:none;background:rgba(32,30,26,.9);color:#f4f1e8;padding:6px 10px;
font:13px/1.5 "Songti SC","STSong",serif;pointer-events:none;z-index:9;border-radius:2px;max-width:260px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">载入中…</div>
<div id="tip"></div>
<script>
"use strict";
const W=4096, PPR=W/(2*Math.PI);
const VTOP=Math.log(Math.tan(Math.PI/4+(85*Math.PI/180)/2));   // 北界 85°N(墨卡托投影极限 85.05°, 90° 处 y→∞ 不可达)
const VBOT=-Math.log(Math.tan(Math.PI/4+(60*Math.PI/180)/2));  // 南界 60°S(南极洲已删, 再往南只有海)
const H=Math.round((VTOP-VBOT)*PPR);
const Y_SHIFT=(VTOP-Math.log(Math.tan(Math.PI/4+(78*Math.PI/180)/2)))*PPR;  // 数据原点平移量: 二进制数据 y=0 对应 78°N, 视图原点改在 85°N, 加载时全体 y += Y_SHIFT(≈+573px)
function X(lon){return (lon+180)*Math.PI/180*PPR}
function Y(lat){const t=Math.max(-60,Math.min(85,lat));return (VTOP-Math.log(Math.tan(Math.PI/4+(t*Math.PI/180)/2)))*PPR}
const PAL=["#f3f0e7","#f0ede3","#f4f1e9","#efece2","#f2efe5","#edeade","#f1eee4","#eeebdf"];
const HOV="rgba(140,158,128,.55)";
const cv=document.getElementById("cv");
let ctx=cv.getContext("2d");   // let: 生成整图快照时临时切换到离屏画布
const hud=document.getElementById("hud"),tip=document.getElementById("tip");
const DPR=Math.min(2,window.devicePixelRatio||1);
const yieldUI=()=>new Promise(r=>setTimeout(r,0));

// ---------- 二进制数据（零解析直读） ----------
// 布局: magic(8) + jsonLen(4) + json(元数据) + BOX(F32 nf*4) + FEATRING(I32 nf+1) + RINGOFF(I32 nring+1) + COORDS(F32 npts*2)
let BOX,FR,ROFF,C,FR2,ROFF2,C2,FRr,ROFFr,Cr,nf=0;
// 水体（湖泊面+河流线, WMWAT1 格式）: WB/WF/WROFF/WC 精版, WB2/WF2/WROFF2/WC2 粗版, RB/RF/RC/RW1 河, 2后缀粗版
let WB,WF,WROFF,WC,WB2,WF2,WROFF2,WC2,RB,RF,RC,RW1,RB2,RF2,RC2,RW2,nl=0,nriv=0,nriv2=0;
const GM=new Map();
const CIDv=[];
let ATAI=-1;   // 南极洲单元序号(应用户要求整个删除, 不参与绘制与高亮)
let DATAV="0b151c46a52757b6ea65c6bb99aeb3e5";  // 数据指纹（对应 gzip 压缩版）；变化则自动重新下载
let WATERV="a684fa86757ab29552e6ef9131aa4a0d";  // 水体数据指纹；变化则自动重新下载
// 注: map_world.bin 现为 gzip 流（内容 magic 1f8b），下载后先解压再解析；兼容旧未压缩版(WMAP1)
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("worldmap",1);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error("数据库被占用"));
    r.onupgradeneeded=()=>r.result.createObjectStore("data");
  });
}
async function idbSave(buf,key,ver){
  key=key||"bin";ver=ver||DATAV;
  try{
    const db=await idbOpen();
    const p=new Promise(res=>{const tx=db.transaction("data","readwrite").objectStore("data").put({h:ver,b:buf},key);tx.oncomplete=()=>res();tx.onerror=()=>res()});
    await Promise.race([p,new Promise(r=>setTimeout(r,5000))]);
  }catch(e){}
}
async function idbGet(key,ver){
  try{
    const db=await idbOpen();
    const got=await new Promise(res=>{
      const tx=db.transaction("data").objectStore("data").get(key);
      tx.onsuccess=()=>res(tx.result);tx.onerror=()=>res(null);
    });
    if(got&&got.h===ver)return got.b;
  }catch(e){}
  return null;
}
// 断点续传下载: 8MB分块+Range重试, 全失败自动换镜像, 防长连接被掐
async function fetchResumable(path, mirrors){
  const urls=[path].concat(mirrors||[]);
  let total=0;
  for(const u of urls){
    try{
      const h=await fetch(u,{method:"HEAD"});
      const cl=+h.headers.get("content-length")||0;
      if(cl>1000000){total=cl;break;}
    }catch(e){}
  }
  if(!total){ // HEAD都失败, 退化为单次下载
    for(const u of urls){
      try{hud.textContent="下载数据…";await yieldUI();
        const r=await fetch(u); if(!r.ok)continue;
        return await r.arrayBuffer();
      }catch(e){}
    }
    throw new Error("无法下载数据(所有来源)");
  }
  const CH=8*1024*1024, out=new Uint8Array(total);
  let url=urls[0];
  for(let s=0;s<total;s+=CH){
    const e=Math.min(s+CH,total)-1;
    let ok=false;
    for(let a=0;a<urls.length*6&&!ok;a++){ // 每块最多重试(来源数×6)次
      if(a&&a%urls.length===0){url=urls[(a/urls.length)%urls.length|0];}
      try{
        const st=performance.now();
        const r=await fetch(url,{headers:{Range:"bytes="+s+"-"+e}});
        if(!(r.status===206||r.status===200))throw new Error(r.status);
        const b=new Uint8Array(await r.arrayBuffer());
        if(r.status===200){ // 服务器不支持Range, 直接回了全量
          if(s===0&&b.length===total)return b.buffer;
          throw new Error("不支持续传");
        }
        if(b.length!==e-s+1)throw new Error("长度不符");
        out.set(b,s);ok=true;
      }catch(err){
        hud.textContent="网络中断, 从断点继续… ("+(s/1048576|0)+"/"+(total/1048576|0)+"MB)";
        await yieldUI();await new Promise(r=>setTimeout(r,800));
      }
    }
    if(!ok)throw new Error("分块下载失败 @" + s);
    hud.textContent="下载数据 "+((s+CH)/1048576|0)+"/"+(total/1048576|0)+"MB";await yieldUI();
  }
  return out.buffer;
}

// ---------- 主源：npmmirror(阿里CDN) npm tarball ----------
// npmmirror 的 /files/ 端点是白名单制(403)，但 tarball 全量下载畅通(302→cdn.npmmirror.com，实测 26MB/s，CORS 已放行)；
// 整包下载后在本地解 tar 提取底图与水体。npm tarball 外层是 gzip 压缩的 tar，需先解压再解析
// 多版本兜底: 最新版优先, 缺哪块补哪块(1.2.0 起含水体, 1.1.0 仅底图)
const TGZS=["https://registry.npmmirror.com/citywar-map-data/-/citywar-map-data-1.2.1.tgz",
            "https://registry.npmmirror.com/citywar-map-data/-/citywar-map-data-1.2.0.tgz",
            "https://registry.npmmirror.com/citywar-map-data/-/citywar-map-data-1.1.0.tgz"];
// 简易 tar 解析(ustar)
function untar(buf){
  const files={},u=new Uint8Array(buf),td=new TextDecoder();
  let off=0;
  while(off+512<=u.length){
    const name=td.decode(u.subarray(off,off+100)).replace(/\0.*$/,"");
    if(!name)break;
    const size=parseInt(td.decode(u.subarray(off+124,off+136)).replace(/\0.*$/,"").trim(),8)||0;
    const prefix=td.decode(u.subarray(off+345,off+500)).replace(/\0.*$/,"").trim();
    off+=512;
    if(size>0)files[(prefix?prefix+"/":"")+name]=u.subarray(off,off+size);
    off+=Math.ceil(size/512)*512;
  }
  return files;
}
async function loadFromNpm(url){
  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),90000);
  try{
    const r=await fetch(url,{signal:ac.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const total=+r.headers.get("content-length")||0;
    const reader=r.body.getReader(),chunks=[];
    let got=0,last=0;
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      chunks.push(value);got+=value.length;
      const now=performance.now();
      if(now-last>150){last=now;
        hud.textContent="下载数据 "+(got/1048576).toFixed(1)+(total?"/"+(total/1048576).toFixed(1):"")+"MB";await yieldUI();}
    }
    const tgz=new Uint8Array(got);let o=0;
    for(const c of chunks){tgz.set(c,o);o+=c.length;}
    if(total&&got!==total)throw new Error("下载不完整 "+got+"/"+total);
    hud.textContent="解包数据…";await yieldUI();
    // 外层 gunzip → tar → 提取底图与水体
    const ds=new Blob([tgz]).stream().pipeThrough(new DecompressionStream("gzip"));
    const tar=new Uint8Array(await new Response(ds).arrayBuffer());
    const files=untar(tar.buffer);
    const out={};
    const bin=files["package/static/map/map_world.bin"];
    if(bin&&bin.length>1000000)out.world=bin.slice().buffer;
    const wat=files["package/static/map/map_water.bin"];
    if(wat&&wat.length>100000)out.water=wat.slice().buffer;
    if(!out.world&&!out.water)throw new Error("数据包内容异常");
    return out;
  }finally{clearTimeout(tm);}
}

async function loadData(){
  let buf=await idbGet("bin",DATAV);
  let wbuf=await idbGet("water",WATERV);
  if(!buf||!wbuf){
    // 主源 npmmirror 阿里CDN tarball：按版本从新到旧逐个尝试, 缺哪块补哪块; 全败回退 HF 源站
    for(const u of TGZS){
      if(buf&&wbuf)break;
      try{
        const t=await loadFromNpm(u);
        if(!buf&&t.world)buf=t.world;
        if(!wbuf&&t.water)wbuf=t.water;
      }catch(e){ hud.textContent="CDN 不可用("+((e&&e.message)||e)+"), 换源重试…"; await yieldUI(); }
    }
    if(!buf){
      // 兜底：HF 源站分片（单文件≤10MiB 限制，底图切为 2MiB×8 片），并行下载+断点续传
      hud.textContent="CDN 不可用, 从备用源并行下载底图…";await yieldUI();
      const t0=performance.now();
      const bufs=await Promise.all([0,1,2,3,4,5,6,7].map(i=>
        fetchResumable("/static/map/map_world.bin.part"+i, []).then(b=>{
          hud.textContent="备用源 "+(i+1)+"/8 片完成 ("+((performance.now()-t0)/1000|0)+"s)";return b;
        })));
      let total=0; for(const b of bufs) total+=b.byteLength;
      const out=new Uint8Array(total); let off=0;
      for(const b of bufs){ out.set(b, off); off+=b.byteLength; }
      buf=out.buffer;
    }
    if(!wbuf){
      try{ wbuf=await fetchResumable("/static/map/map_water.bin", []); }catch(e){}
    }
    if(buf)idbSave(buf,"bin",DATAV);
    if(wbuf)idbSave(wbuf,"water",WATERV);
  }
  // gzip 流检测: 1f8b → 浏览器原生解压; 旧未压缩版(WMAP1)直接用
  const u8=new Uint8Array(buf);
  if(u8[0]===0x1f&&u8[1]===0x8b){
    const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    buf=await new Response(ds).arrayBuffer();
  }
  const dv=new DataView(buf);
  const jl=dv.getUint32(8,true);
  const meta=JSON.parse(new TextDecoder("utf-8").decode(new Uint8Array(buf,12,jl)));
  let off=12+jl; while(off%4)off++;
  nf=meta.nf;
  BOX=new Float32Array(buf,off,nf*4); off+=nf*16;
  FR=new Int32Array(buf,off,nf+1); off+=(nf+1)*4;
  ROFF=new Int32Array(buf,off,meta.nring+1); off+=(meta.nring+1)*4;
  C=new Float32Array(buf,off,meta.npts*2); off+=meta.npts*8;
  FR2=new Int32Array(buf,off,nf+1); off+=(nf+1)*4;
  ROFF2=new Int32Array(buf,off,meta.nring2+1); off+=(meta.nring2+1)*4;
  C2=new Float32Array(buf,off,meta.npts2*2);
  for(let i=0;i<nf;i++){
    const p=meta.meta[i];
    CIDv[i]=p.g;
    if(p.gn==="南极洲")ATAI=i;
    let g=GM.get(p.g);
    if(!g){g={name:p.gn,region:p.region,area:0,mem:[]};GM.set(p.g,g)}
    g.area+=p.area||0;
    g.mem.push(i);
  }
  for(const g of GM.values()){
    let big=g.mem[0],ba=-1;
    for(const i of g.mem){
      const w=BOX[i*4+2]-BOX[i*4],h=BOX[i*4+3]-BOX[i*4+1];
      if(w*h>ba){ba=w*h;big=i}
    }
    g.lbl={x:(BOX[big*4]+BOX[big*4+2])/2,y:(BOX[big*4+1]+BOX[big*4+3])/2,
           w:Math.min(BOX[big*4+2]-BOX[big*4],BOX[big*4+3]-BOX[big*4+1])};
  }
  // 坐标原点平移: 数据 y=0 在 78°N, 视图 y=0 在 85°N, 全体 y 坐标加偏移(否则 78°N 以北的格陵兰/北极群岛被裁掉)
  for(let k=1;k<C.length;k+=2)C[k]+=Y_SHIFT;
  for(let k=1;k<C2.length;k+=2)C2[k]+=Y_SHIFT;
  for(let i=0;i<nf;i++){BOX[i*4+1]+=Y_SHIFT;BOX[i*4+3]+=Y_SHIFT}
  for(const g of GM.values())g.lbl.y+=Y_SHIFT;
  // ---------- 水体解析 ----------
  if(wbuf){
    try{
      const w8=new Uint8Array(wbuf);
      if(w8[0]===0x1f&&w8[1]===0x8b){
        const ds=new Blob([wbuf]).stream().pipeThrough(new DecompressionStream("gzip"));
        wbuf=await new Response(ds).arrayBuffer();
      }
      const wd=new DataView(wbuf);
      const wjl=wd.getUint32(8,true);
      const wm=JSON.parse(new TextDecoder("utf-8").decode(new Uint8Array(wbuf,12,wjl)));
      let wo=12+wjl; while(wo%4)wo++;
      nl=wm.nl;
      WB=new Float32Array(wbuf,wo,nl*4); wo+=nl*16;
      WF=new Int32Array(wbuf,wo,nl+1); wo+=(nl+1)*4;
      WROFF=new Int32Array(wbuf,wo,wm.nring+1); wo+=(wm.nring+1)*4;
      WC=new Float32Array(wbuf,wo,wm.lpts*2); wo+=wm.lpts*8;
      WB2=new Float32Array(wbuf,wo,wm.nl2*4); wo+=wm.nl2*16;
      WF2=new Int32Array(wbuf,wo,wm.nl2+1); wo+=(wm.nl2+1)*4;
      WROFF2=new Int32Array(wbuf,wo,wm.nring2+1); wo+=(wm.nring2+1)*4;
      WC2=new Float32Array(wbuf,wo,wm.lpts2*2); wo+=wm.lpts2*8;
      nriv=wm.nriv;
      RB=new Float32Array(wbuf,wo,nriv*4); wo+=nriv*16;
      RF=new Int32Array(wbuf,wo,nriv+1); wo+=(nriv+1)*4;
      RC=new Float32Array(wbuf,wo,wm.rivpts*2); wo+=wm.rivpts*8;
      RW1=new Uint8Array(wbuf,wo,nriv); wo+=nriv;
      // 注意: RW1 后可能无 4 字节对齐(旧数据包), 直接 Float32Array 视图会 RangeError → 用 slice 拷贝解析(无对齐要求)
      nriv2=wm.nriv2;
      const rlen=nriv2*16+(nriv2+1)*4+wm.rivpts2*8+nriv2;
      const rbuf=wbuf.slice(wo,wo+rlen);
      RB2=new Float32Array(rbuf,0,nriv2*4);
      RF2=new Int32Array(rbuf,nriv2*16,nriv2+1);
      RC2=new Float32Array(rbuf,nriv2*16+(nriv2+1)*4,wm.rivpts2*2);
      RW2=new Uint8Array(rbuf,nriv2*16+(nriv2+1)*4+wm.rivpts2*8,nriv2);
      // 水体坐标同步平移(与陆地同原点)
      for(let k=1;k<WC.length;k+=2)WC[k]+=Y_SHIFT;
      for(let k=1;k<WC2.length;k+=2)WC2[k]+=Y_SHIFT;
      for(let k=1;k<RC.length;k+=2)RC[k]+=Y_SHIFT;
      for(let k=1;k<RC2.length;k+=2)RC2[k]+=Y_SHIFT;
      for(let i=0;i<nl;i++){WB[i*4+1]+=Y_SHIFT;WB[i*4+3]+=Y_SHIFT}
      for(let i=0;i<wm.nl2;i++){WB2[i*4+1]+=Y_SHIFT;WB2[i*4+3]+=Y_SHIFT}
      for(let i=0;i<nriv;i++){RB[i*4+1]+=Y_SHIFT;RB[i*4+3]+=Y_SHIFT}
      for(let i=0;i<nriv2;i++){RB2[i*4+1]+=Y_SHIFT;RB2[i*4+3]+=Y_SHIFT}
    }catch(e){ console.warn("水体数据解析失败",e); }
  }
}
// ---------- 空间索引（2° 网格，供拾取与裁剪） ----------
const CS=2,GRD=new Map(),BIG=[];
function buildGrid(){
  for(let i=0;i<nf;i++){
    const a=BOX[i*4],b=BOX[i*4+1],e=BOX[i*4+2],d=BOX[i*4+3];
    const x0=Math.floor((a/W*360+180)/CS),x1=Math.floor((e/W*360+180)/CS);
    const y0=Math.floor((b/H*360+180)/CS),y1=Math.floor((d/H*360+180)/CS);
    let xspan=x1-x0+1; if(xspan<=0)xspan+=180;   // 跨180°经线的单元(如斐济)环绕计数
    if(xspan*(y1-y0+1)>48){BIG.push(i);continue}
    for(let t=0;t<xspan;t++)for(let y=y0;y<=y1;y++){
      const xx=(((x0+t)%180)+180)%180;   // 经度环绕: 列键取模(必须与绘制查询一致, 否则精版全被裁掉)
      const k=xx+":"+y;let arr=GRD.get(k);if(!arr){arr=[];GRD.set(k,arr)}arr.push(i);
    }
  }
}
function inPolys(px,py,i){
  let inside=false;
  for(let r=FR[i];r<FR[i+1];r++){
    const s=ROFF[r]*2,t=ROFF[r+1]*2;let cnt=0;
    let j=t-2;
    for(let a=s;a<t;a+=2){
      const xi=C[a],yi=C[a+1],xj=C[j],yj=C[j+1];
      if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)cnt++;
      j=a;
    }
    if(cnt&1)inside=!inside;
  }
  return inside;
}
function pick(lon,lat){
  const px=X(lon),py=Y(lat);
  const xx=(((Math.floor((px/W*360+180)/CS))%180)+180)%180;
  const k=xx+":"+Math.floor((py/H*360+180)/CS);
  const cand=(GRD.get(k)||[]).concat(BIG);
  for(const i of cand){
    if(px<BOX[i*4]||px>BOX[i*4+2]||py<BOX[i*4+1]||py>BOX[i*4+3])continue;
    if(inPolys(px,py,i))return i;
  }
  return -1;
}
// ---------- 视图 ----------
let scale=1,ox=0,oy=0,hovG=-1,pend=false,OX=0,hovOX=0;  // OX=当前绘制的世界副本屏幕偏移(横向环绕)
let lastFine=null,lastFS={scale:0,ox:0,oy:0};  // 上一帧精版画面缓存(交互期贴图用)
function fit(){
  scale=Math.min(cv.width/DPR/W,cv.height/DPR/H)*0.98;
  ox=(cv.width/DPR-W*scale)/2;oy=(cv.height/DPR-H*scale)/2;
}
// 横向环绕: ox 归一到 [0,W*scale), 配合多副本绘制实现左右无限平移(地球是圆的)
function wrapOx(){
  const ws=W*scale;
  if(ws>1)ox=((ox%ws)+ws)%ws;
}
// 缩放下限(最小缩放仍能同时看到南北极) + 垂直平移限制(不出现空白)
function clampView(){
  const vw=cv.width/DPR,vh=cv.height/DPR;
  const sMin=Math.min(vw/W,vh/H)*0.98;
  if(scale<sMin){const f=sMin/scale;scale=sMin;ox=vw/2-(vw/2-ox)*f;oy=vh/2-(vh/2-oy)*f;}
  wrapOx();
  const hs=H*scale;
  if(hs<=vh)oy=(vh-hs)/2;
  else{if(oy>0)oy=0;if(oy+hs<vh)oy=vh-hs;}
}
function resize(){
  cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  // 精版帧缓存: 交互(拖动/缩放)期间贴上一帧精版画面, 消除粗/精 LOD 切换闪烁
  lastFine=document.createElement("canvas");
  lastFine.width=cv.width;lastFine.height=cv.height;
  lastFS={scale:0,ox:0,oy:0};
  fit();clampView();schedule();
}
function schedule(){if(!pend){pend=true;requestAnimationFrame(draw)}}
// 交互期间一律用粗版 LOD 保证流畅, 停止 200ms 后自动重绘精版
let idleT=0,idleTimer=0;
function interact(){
  idleT=Date.now();
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{idleT=0;schedule()},200);
  schedule();
}
function addRings(g,i){  // 向画布 g 的当前路径追加要素 i 的全部环(用 FRr/ROFFr/Cr 与当前副本偏移 OX)
  for(let r=FRr[i];r<FRr[i+1];r++){
    const s=ROFFr[r]*2,t=ROFFr[r+1]*2;
    g.moveTo(Cr[s]*scale+OX,Cr[s+1]*scale+oy);
    for(let a=s+2;a<t;a+=2)g.lineTo(Cr[a]*scale+OX,Cr[a+1]*scale+oy);
    g.closePath();
  }
}
function strokePoly(i){ctx.beginPath();addRings(ctx,i)}
function drawLand(cand,wx0,wx1,wy0,wy1){
  ctx.lineWidth=.6;ctx.strokeStyle="rgba(70,68,60,.35)";ctx.lineJoin="round";
  // 按主题色分桶, 每桶合并为一条路径只做一次填充+描边(大幅减少状态切换)
  const BK=[[],[],[],[],[],[],[],[]];
  const put=i=>{
    if(i===ATAI)return;   // 南极洲已删
    const a=BOX[i*4],b=BOX[i*4+1],e=BOX[i*4+2],d=BOX[i*4+3];
    if(e<wx0||a>wx1||d<wy0||b>wy1)return;
    const wpx=(e-a)*scale,hpx=(d-b)*scale;
    if(wpx<.7&&hpx<.7)return;
    BK[CIDv[i]%8].push(i);
  };
  if(cand){for(const i of cand)put(i)}
  else{for(let i=0;i<nf;i++)put(i)}
  for(let b=0;b<8;b++){
    const arr=BK[b];if(!arr.length)continue;
    ctx.beginPath();
    for(const i of arr)addRings(ctx,i);
    ctx.fillStyle=PAL[b];ctx.fill();
    ctx.stroke();
  }
}
// ---------- 整图快照：启动后分帧渐进渲染一张固定分辨率世界位图(scale=1, 4096px 宽) ----------
// 之后所有缩小态的拖动/缩放都直接贴这张图, 零矢量重绘、零重复构建, 彻底消除卡顿
let snap=null,snapJob=null;
function paintLandChunk(g,from,to){
  g.lineWidth=.6;g.strokeStyle="rgba(70,68,60,.35)";g.lineJoin="round";
  const BK=[[],[],[],[],[],[],[],[]];
  for(let i=from;i<to;i++){if(i!==ATAI)BK[CIDv[i]%8].push(i)}
  for(let b=0;b<8;b++){
    const arr=BK[b];if(!arr.length)continue;
    g.beginPath();
    for(const i of arr)addRings(g,i);
    g.fillStyle=PAL[b];g.fill();g.stroke();
  }
}
function paintLakeChunk(g,from,to){
  g.fillStyle=SEAC;
  for(let i=from;i<to;i++){
    g.beginPath();
    for(let r=WF[i];r<WF[i+1];r++){
      const s=WROFF[r]*2,t=WROFF[r+1]*2;
      g.moveTo(WC[s],WC[s+1]);
      for(let p=s+2;p<t;p+=2)g.lineTo(WC[p],WC[p+1]);
      g.closePath();
    }
    g.fill("evenodd");
  }
}
function paintRiverChunk(g,from,to){
  g.strokeStyle=SEAC;g.lineCap="round";g.lineJoin="round";
  for(let w=0;w<3;w++){
    g.beginPath();let any=false;
    for(let i=from;i<to;i++){
      if((RW1[i]||0)!==w)continue;
      const s=RF[i]*2,t=RF[i+1]*2;
      g.moveTo(RC[s],RC[s+1]);
      for(let p=s+2;p<t;p+=2)g.lineTo(RC[p],RC[p+1]);
      any=true;
    }
    if(any){g.lineWidth=RIVW[w]||1.1;g.stroke()}
  }
}
function startSnapBuild(){
  if(snapJob||snap||!nf)return;
  const c=document.createElement("canvas");
  c.width=W;c.height=H;
  const sc=c.getContext("2d");
  sc.fillStyle="#a6cbe2";sc.fillRect(0,0,W,H);
  snapJob={c,sc,land:0,lake:0,river:0,phase:0};
  requestAnimationFrame(pumpSnap);
}
function pumpSnap(){
  const j=snapJob;if(!j)return;
  if(idleT){ requestAnimationFrame(pumpSnap); return; }   // 交互期间让路, 空闲后再继续构建
  const t0=performance.now();
  const sCtx=ctx,sOx=OX,sOy=oy,sSc=scale,sFRr=FRr,sROFFr=ROFFr,sCr=Cr;
  ctx=j.sc;OX=0;oy=0;scale=1;FRr=FR;ROFFr=ROFF;Cr=C;   // 快照用精版几何
  try{
    while(performance.now()-t0<12){                       // 每帧最多画 12ms, 不阻塞交互
      if(j.phase===0){
        const to=Math.min(nf,j.land+600);
        paintLandChunk(j.sc,j.land,to);j.land=to;
        if(j.land>=nf)j.phase=1;
      }else if(j.phase===1){
        const to=Math.min(nl,j.lake+200);
        paintLakeChunk(j.sc,j.lake,to);j.lake=to;
        if(j.lake>=nl)j.phase=2;
      }else{
        const to=Math.min(nriv,j.river+400);
        paintRiverChunk(j.sc,j.river,to);j.river=to;
        if(j.river>=nriv)j.phase=3;
      }
      if(j.phase>=3)break;
    }
  }catch(e){ console.error("快照构建失败, 改用矢量渲染",e); snapJob=null;
    ctx=sCtx;OX=sOx;oy=sOy;scale=sSc;FRr=sFRr;ROFFr=sROFFr;Cr=sCr;return; }
  ctx=sCtx;OX=sOx;oy=sOy;scale=sSc;FRr=sFRr;ROFFr=sROFFr;Cr=sCr;
  if(j.phase>=3){snap=j.c;snapJob=null}
  else requestAnimationFrame(pumpSnap);
}
function draw(){
  pend=false;
  const vw=cv.width/DPR,vh=cv.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#a6cbe2";ctx.fillRect(0,0,vw,vh);
  const zoomed=(vw/scale)<W*0.15||scale>1.25;  // 放大态走矢量(粗/精 LOD); 缩小态一律贴快照(≤1.25 倍轻微上采样)
  if(!zoomed){
    lastFS.scale=0;   // 回到缩小态: 作废旧精版缓存, 防止再放大时贴到过期画面
    if(snap){
      const ws=W*scale,hs=H*scale;
      const k0=Math.floor((0-ox)/ws),k1=Math.floor((vw-ox)/ws);
      for(let k=k0;k<=k1;k++)ctx.drawImage(snap,ox+k*ws,oy,ws,hs);
    }else{
      FRr=FR2;ROFFr=ROFF2;Cr=C2;   // 快照未就绪时先用粗版矢量顶替
      const ws=W*scale;
      const k0=Math.floor((0-ox)/ws),k1=Math.floor((vw-ox)/ws);
      for(let k=k0;k<=k1;k++){
        OX=ox+k*ws;
        try{
          drawLand(null,(0-OX)/scale-1e6,(vw-OX)/scale+1e6,(0-oy)/scale-1e6,(vh-oy)/scale+1e6);
          drawWater(false,(0-OX)/scale-1e6,(vw-OX)/scale+1e6,(0-oy)/scale-1e6,(vh-oy)/scale+1e6);
        }catch(e){ console.error("副本渲染失败 k="+k,e) }
      }
      startSnapBuild();   // 首帧渲染后立即开始渐进构建快照
    }
  }else{
    const fine=!idleT;
    if(!fine&&lastFine&&lastFS.scale>0){
      // 交互中: 直接贴上一帧精版画面(按当前视图变换缩放/平移), 粗/精 LOD 切换不再闪烁
      const f=scale/lastFS.scale;
      ctx.drawImage(lastFine,ox-lastFS.ox*f,oy-lastFS.oy*f,vw*f,vh*f);
    }else{
      FRr=fine?FR:FR2;ROFFr=fine?ROFF:ROFF2;Cr=fine?C:C2;
      // 横向环绕: 画出与视口相交的所有世界副本(通常 1~2 个)
      const ws=W*scale;
      const k0=Math.floor((0-ox)/ws),k1=Math.floor((vw-ox)/ws);
      for(let k=k0;k<=k1;k++){
        OX=ox+k*ws;
        const wx0=(0-OX)/scale,wx1=(vw-OX)/scale,wy0=(0-oy)/scale,wy1=(vh-oy)/scale;
        let cand=null;
        if(fine){
          const gx0=Math.floor((wx0/W*360+180)/CS)-1,gx1=Math.floor((wx1/W*360+180)/CS)+1;
          const gy0=Math.floor((wy0/H*360+180)/CS)-1,gy1=Math.floor((wy1/H*360+180)/CS)+1;
          const seen=new Set();
          for(let x=gx0;x<=gx1;x++)for(let y=gy0;y<=gy1;y++){
            const xx=((x%180)+180)%180;   // 经度环绕: 网格列号取模
            const arr=GRD.get(xx+":"+y);if(arr)for(const i of arr)seen.add(i);
          }
          for(const i of BIG)seen.add(i);
          cand=seen;
        }
        try{
          drawLand(cand,wx0,wx1,wy0,wy1);
          drawWater(fine,wx0,wx1,wy0,wy1);   // 河湖与海同色, 盖在陆地色块上
        }catch(e){ console.error("副本渲染失败 k="+k,e) }
      }
      if(lastFine&&(scale!==lastFS.scale||ox!==lastFS.ox||oy!==lastFS.oy)&&(fine||lastFS.scale<=0)){
        // 烘焙缓存帧: 精版空闲且视图有变才重烤; 首次交互无缓存时把当前帧(粗版)也先烘焙,
        // 后续刻度即改走贴图, 消除"第一次缩放卡一段时间"
        const lc=lastFine.getContext("2d");
        lc.setTransform(1,0,0,1,0,0);
        lc.clearRect(0,0,lastFine.width,lastFine.height);
        lc.drawImage(cv,0,0);
        lastFS={scale,ox,oy};
      }
    }
  }
  if(hovG>=0){
    const g=GM.get(hovG);
    if(g&&g.name!=="南极洲"){   // 南极洲已删, 不做高亮
      OX=hovOX;FRr=FR;ROFFr=ROFF;Cr=C;ctx.fillStyle=HOV;
      for(const i of g.mem){if(i!==ATAI){strokePoly(i);ctx.fill()}}
    }
  }
  drawScale(vw,vh);
}
// ---------- 水体绘制（湖泊面 evenodd 填充 + 河流分级描边, 均为海色） ----------
// 水体恒用精版: 粗版缺 943 个小湖, 粗/精切换会让湖一闪一闪(陆地↔海洋); 精版水体仅 7.5 万点, 成本可忽略
// 湖泊逐个 evenodd 填充(与快照一致): 批量合并路径时重叠湖会 XOR 成陆地色
const SEAC="#a6cbe2", RIVW=[1.1,1.7,2.5];
function drawWater(z,wx0,wx1,wy0,wy1){
  if(!nl&&!nriv)return;
  ctx.fillStyle=SEAC;ctx.strokeStyle=SEAC;ctx.lineCap="round";ctx.lineJoin="round";
  if(nl){
    for(let i=0;i<nl;i++){
      const a=WB[i*4],b=WB[i*4+1],e=WB[i*4+2],d=WB[i*4+3];
      if(e<wx0||a>wx1||d<wy0||b>wy1)continue;
      ctx.beginPath();
      for(let r=WF[i];r<WF[i+1];r++){
        const s=WROFF[r]*2,t=WROFF[r+1]*2;
        ctx.moveTo(WC[s]*scale+OX,WC[s+1]*scale+oy);
        for(let p=s+2;p<t;p+=2)ctx.lineTo(WC[p]*scale+OX,WC[p+1]*scale+oy);
        ctx.closePath();
      }
      ctx.fill("evenodd");
    }
  }
  if(nriv){
    // 按线宽分 3 桶批量描边, 减少状态切换
    for(let w=0;w<3;w++){
      ctx.beginPath();let any=false;
      for(let i=0;i<nriv;i++){
        if((RW1[i]||0)!==w)continue;
        const a=RB[i*4],b=RB[i*4+1],e=RB[i*4+2],d=RB[i*4+3];
        if(e<wx0||a>wx1||d<wy0||b>wy1)continue;
        const s=RF[i]*2,t=RF[i+1]*2;
        ctx.moveTo(RC[s]*scale+OX,RC[s+1]*scale+oy);
        for(let p=s+2;p<t;p+=2)ctx.lineTo(RC[p]*scale+OX,RC[p+1]*scale+oy);
        any=true;
      }
      if(any){ctx.lineWidth=RIVW[w]||1.1;ctx.stroke()}
    }
  }
}
// ---------- 比例尺（墨卡托：视口中心纬度换算） ----------
const SCALE_STEPS=[5000,3000,2000,1000,500,300,200,100,50,30,20,10,5,2,1];
function drawScale(vw,vh){
  const wx=(vw/2-ox)/scale, wy=(vh/2-oy)/scale;
  const ym=VTOP-wy/PPR;
  const lat=(2*Math.atan(Math.exp(ym))-Math.PI/2)*180/Math.PI;
  const kmPerPx=111.32*Math.cos(lat*Math.PI/180)/(PPR*Math.PI/180*scale);
  let km=SCALE_STEPS[SCALE_STEPS.length-1];
  for(const s of SCALE_STEPS){ if(s/kmPerPx<=140){km=s;break} }
  const px=km/kmPerPx;
  const x2=vw-30, x1=x2-px, y1=vh-22;
  ctx.strokeStyle="#33302a"; ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(x1,y1-5);ctx.lineTo(x1,y1);ctx.lineTo(x2,y1);ctx.lineTo(x2,y1-5);
  ctx.stroke();
  ctx.font="12px 'Songti SC','STSong','SimSun',serif";
  ctx.textAlign="center";ctx.textBaseline="bottom";
  // 标注参照纬度：比例尺读数随视口中心纬度变化（墨卡托形变），标明刻度所在纬度使读数有明确定义
  const la=Math.abs(lat);
  const latStr=la<0.5?"0°":Math.round(la)+"°"+(lat>=0?"N":"S");
  const label=km.toLocaleString()+" km · "+latStr;
  ctx.lineWidth=3;ctx.strokeStyle="rgba(250,248,242,.85)";
  ctx.strokeText(label,(x1+x2)/2,y1-2);
  ctx.fillStyle="#33302a";ctx.fillText(label,(x1+x2)/2,y1-2);
}
// ---------- 事件 ----------
let drag=false,sx0=0,sy0=0;
cv.addEventListener("mousedown",e=>{drag=true;sx0=e.clientX;sy0=e.clientY;cv.style.cursor="grabbing"});
addEventListener("mouseup",()=>{drag=false;cv.style.cursor="grab"});
cv.addEventListener("dblclick",()=>{fit();clampView();schedule()});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const sMin=Math.min(cv.width/DPR/W,cv.height/DPR/H)*0.98;
  if(e.deltaY>0&&scale<=sMin+1e-6)return;  // 已到最小缩放, 不再移动/缩小
  const f=e.deltaY<0?1.18:1/1.18;
  const mx=e.clientX,my=e.clientY;
  ox=mx-(mx-ox)*f;oy=my-(my-oy)*f;scale*=f;
  clampView();
  interact();
},{passive:false});
addEventListener("resize",resize);
function normLon(lon){return ((lon+180)%360+360)%360-180}  // 归一到 [-180,180), 配合横向环绕
cv.addEventListener("mousemove",e=>{
  if(drag){ox+=e.clientX-sx0;oy+=e.clientY-sy0;sx0=e.clientX;sy0=e.clientY;clampView();interact();return}
  const lon=normLon((e.clientX-ox)/scale/W*360-180);
  const my=(e.clientY-oy)/scale;
  const ym=VTOP-my/PPR;
  const lat=(2*Math.atan(Math.exp(ym))-Math.PI/2)*180/Math.PI;
  const i=pick(lon,lat);
  const g=i>=0?GM.get(CIDv[i]):null;
  if(g){
    hovOX=ox+Math.floor((e.clientX-ox)/(W*scale))*(W*scale);  // 光标所在的世界副本
    if(CIDv[i]!==hovG){hovG=CIDv[i];schedule()}
    tip.style.display="block";
    tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px";
    tip.innerHTML="<b>"+(g.name||"?")+"</b><br>"+(g.region||"")+" · ≈"+Math.round(g.area||0).toLocaleString()+" km²";
  }else{
    if(hovG!==-1){hovG=-1;schedule()}
    tip.style.display="none";
  }
});
cv.addEventListener("mouseleave",()=>{tip.style.display="none";if(hovG!==-1){hovG=-1;schedule()}});
// ---------- 触屏：单指拖动 / 双指捏合 / 轻点拾取 ----------
let tDrag=false,tX0=0,tY0=0,tMoved=false,tPinch=null,tT0=0;
cv.addEventListener("touchstart",e=>{
  e.preventDefault();
  if(e.touches.length===1){
    tDrag=true;tMoved=false;tT0=Date.now();
    tX0=e.touches[0].clientX;tY0=e.touches[0].clientY;
  }else if(e.touches.length===2){
    tDrag=false;
    const a=e.touches[0],b=e.touches[1];
    tPinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
            mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2};
  }
},{passive:false});
cv.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(tPinch&&e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
    const f=d/tPinch.d;
    ox=mx-(tPinch.mx-ox)*f;oy=my-(tPinch.my-oy)*f;scale*=f;
    tPinch.d=d;tPinch.mx=mx;tPinch.my=my;
    tMoved=true;clampView();interact();
  }else if(tDrag&&e.touches.length===1){
    const x=e.touches[0].clientX,y=e.touches[0].clientY;
    if(Math.abs(x-tX0)+Math.abs(y-tY0)>4)tMoved=true;
    ox+=x-tX0;oy+=y-tY0;tX0=x;tY0=y;clampView();interact();
  }
},{passive:false});
cv.addEventListener("touchend",e=>{
  e.preventDefault();
  if(e.touches.length===0){
    if(!tMoved&&Date.now()-tT0<350&&tDrag){
      const x=e.changedTouches[0].clientX,y=e.changedTouches[0].clientY;
      const lon=normLon((x-ox)/scale/W*360-180);
      const ym=VTOP-((y-oy)/scale)/PPR;
      const lat=(2*Math.atan(Math.exp(ym))-Math.PI/2)*180/Math.PI;
      const i=pick(lon,lat);
      if(i>=0){
        const g=GM.get(CIDv[i]);
        hovG=CIDv[i];hovOX=ox+Math.floor((x-ox)/(W*scale))*(W*scale);schedule();
        tip.style.display="block";
        tip.style.left=Math.min(x+14,innerWidth-270)+"px";
        tip.style.top=Math.min(y+14,innerHeight-90)+"px";
        tip.innerHTML="<b>"+(g.name||"?")+"</b><br>"+(g.region||"")+" · ≈"+Math.round(g.area||0).toLocaleString()+" km²";
        setTimeout(()=>{tip.style.display="none";if(hovG!==-1){hovG=-1;schedule()}},3200);
      }else{
        tip.style.display="none";
        if(hovG!==-1){hovG=-1;schedule()}
      }
    }
    tDrag=false;tPinch=null;
  }else if(e.touches.length===1){
    tPinch=null;tDrag=true;tMoved=true;
    tX0=e.touches[0].clientX;tY0=e.touches[0].clientY;
  }
},{passive:false});
cv.addEventListener("touchstart",e=>{if(e.touches.length>=1)interact()},{passive:true});
// ---------- 启动 ----------
// 任何运行时错误直接显示到 HUD, 方便远程定位问题
window.addEventListener("error",e=>{
  hud.textContent="运行错误: "+(e.message||e.type)+" @"+(e.lineno||"?")+"行";
  hud.style.background="rgba(255,220,200,.95)";
});
window.addEventListener("unhandledrejection",e=>{
  hud.textContent="异步错误: "+((e.reason&&e.reason.message)||e.reason||"unknown");
  hud.style.background="rgba(255,220,200,.95)";
});
(async function(){
  const T0=performance.now();
  try{
    hud.textContent="下载数据…";await yieldUI();
    await loadData();
    hud.textContent="建索引…";await yieldUI();
    buildGrid();
    resize();
    startSnapBuild();   // 数据就绪即开始渐进构建快照(不依赖首帧渲染成功)
    const el=((performance.now()-T0)/1000).toFixed(1);
    hud.textContent="世界底图 · 版块 "+GM.size+" · 行政单元 "+nf+" · 拖动平移 / 滚轮缩放 / 双击复位 (加载 "+el+"s)";
  }catch(err){
    hud.textContent="加载失败: "+((err&&err.message)||err);
  }
})();
</script>
