<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城池战争 - 后台管理</title>
    <style>
        :root {
            --bg: #0c1222;
            --bg-card: #151d30;
            --bg-input: #1a2540;
            --border: #243050;
            --text: #e8ecf4;
            --text-dim: #7a8baa;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
            --gold: #eab308;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ===== 登录页 ===== */
        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 36px;
            width: 90%;
            max-width: 380px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        .login-title svg {
            width: 32px; height: 32px;
            stroke: var(--primary); fill: none; stroke-width: 1.5;
            vertical-align: middle; margin-right: 8px;
        }
        .field { margin-bottom: 16px; }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .field-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color .2s;
        }
        .field-input::placeholder { color: #4a5a78; }
        .field-input:focus { border-color: var(--primary); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-block { width: 100%; }
        .btn-lg { padding: 12px 24px; font-size: 15px; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary {
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { background: rgba(255,255,255,.1); }
        .error-msg {
            color: var(--red);
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 20px;
        }

        /* ===== 管理面板 ===== */
        .admin-wrap {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧导航 */
        .admin-sidebar {
            width: 200px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            flex-shrink: 0;
        }
        .sidebar-logo {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            padding: 0 16px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            color: var(--primary);
            letter-spacing: 1px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all .15s;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-item:hover { color: var(--text); background: rgba(59,130,246,.06); }
        .nav-item.active { color: var(--primary); background: rgba(59,130,246,.1); border-right: 3px solid var(--primary); }
        .nav-item svg {
            width: 18px; height: 18px;
            stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0;
        }

        /* 右侧内容 */
        .admin-main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* 顶部栏 */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .admin-header-title {
            font-size: 20px;
            font-weight: 700;
        }
        .admin-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .admin-header-info span { color: var(--primary); font-weight: 600; }

        /* 表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .data-table th {
            background: rgba(59,130,246,.08);
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
        }
        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: rgba(59,130,246,.04); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-blue { background: rgba(59,130,246,.15); color: var(--primary); }
        .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
        .badge-red { background: rgba(239,68,68,.15); color: var(--red); }
        .badge-gold { background: rgba(234,179,8,.15); color: var(--gold); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 14px;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .admin-wrap { flex-direction: column; }
            .admin-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 12px 0;
            }
            .sidebar-logo { border-bottom: none; margin-bottom: 0; padding-bottom: 8px; }
            .nav-list { display: flex; justify-content: center; gap: 4px; }
            .nav-item { padding: 8px 16px; font-size: 13px; }
            .nav-item.active { border-right: none; border-bottom: 3px solid var(--primary); }
            .admin-main { padding: 16px; }
            .data-table th, .data-table td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
{% if page == 'login' %}
<!-- ===== 登录页 ===== -->
<div class="login-wrap">
    <div class="login-card">
        <div class="login-title">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            后台管理登录
        </div>
        <div id="loginError" class="error-msg"></div>
        <div class="field">
            <label class="field-label">管理员账号</label>
            <input type="text" id="adminUsername" class="field-input" placeholder="输入管理员账号" autocomplete="off">
        </div>
        <div class="field">
            <label class="field-label">密码</label>
            <input type="password" id="adminPassword" class="field-input" placeholder="输入密码" autocomplete="off">
        </div>
        <button id="adminLoginBtn" class="btn btn-primary btn-block btn-lg">登录</button>
    </div>
</div>
<script>
document.getElementById('adminLoginBtn').addEventListener('click', async () => {
    const username = document.getElementById('adminUsername').value.trim();
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    if (!username || !password) { errorEl.textContent = '请输入账号和密码'; return; }
    try {
        const res = await fetch('/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/admin.html';
        } else {
            errorEl.textContent = data.message || '登录失败';
        }
    } catch (e) {
        errorEl.textContent = '网络错误';
    }
});
// 回车提交
document.getElementById('adminPassword').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('adminLoginBtn').click(); });
</script>

{% else %}
<!-- ===== 管理面板 ===== -->
<div class="admin-wrap">
    <!-- 左侧导航 -->
    <div class="admin-sidebar">
        <div class="sidebar-logo">城池战争管理</div>
        <div class="nav-list">
            <div class="nav-item active" data-tab="users" onclick="switchTab('users')">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                用户管理
            </div>
            <div class="nav-item" data-tab="rooms" onclick="switchTab('rooms')">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                房间管理
            </div>
        </div>
    </div>

    <!-- 右侧内容 -->
    <div class="admin-main">
        <!-- 顶部栏 -->
        <div class="admin-header">
            <div class="admin-header-title" id="pageTitle">用户管理</div>
            <div class="admin-header-info">
                管理员：<span>{{ admin_name }}</span>
                <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px" onclick="doAdminLogout()">退出</button>
            </div>
        </div>

        <!-- 用户管理 -->
        <div id="tab-users">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>用户名</th>
                        <th>昵称</th>
                        <th>邮箱</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="4" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 房间管理 -->
        <div id="tab-rooms" style="display:none">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>房间号</th>
                        <th>房间名</th>
                        <th>玩家数</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="roomTableBody">
                    <tr><td colspan="5" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// 切换标签页
function switchTab(tab) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector('.nav-item[data-tab="' + tab + '"]').classList.add('active');
    document.getElementById('tab-users').style.display = tab === 'users' ? '' : 'none';
    document.getElementById('tab-rooms').style.display = tab === 'rooms' ? '' : 'none';
    document.getElementById('pageTitle').textContent = tab === 'users' ? '用户管理' : '房间管理';
    if (tab === 'users') loadUsers();
    if (tab === 'rooms') loadRooms();
}

// 加载用户列表
async function loadUsers() {
    try {
        const res = await fetch('/admin/api/users');
        const data = await res.json();
        const tbody = document.getElementById('userTableBody');
        if (data.success && data.users.length > 0) {
            tbody.innerHTML = data.users.map(u => `
                <tr>
                    <td>${esc(u.username)}</td>
                    <td>${esc(u.display_name || '-')}</td>
                    <td>${esc(u.email || '-')}</td>
                    <td><button class="btn btn-danger" style="padding:4px 12px;font-size:12px" onclick="deleteUser('${esc(u.username)}')">删除</button></td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暂无用户</td></tr>';
        }
    } catch (e) {
        document.getElementById('userTableBody').innerHTML = '<tr><td colspan="4" class="empty-state">加载失败</td></tr>';
    }
}

// 加载房间列表
async function loadRooms() {
    try {
        const res = await fetch('/admin/api/rooms');
        const data = await res.json();
        const tbody = document.getElementById('roomTableBody');
        if (data.success && data.rooms.length > 0) {
            const phaseLabels = { 'waiting': '等待中', 'action': '行动', 'meeting': '会议', 'auction': '拍卖', 'duel': '约战', 'finished': '已结束' };
            const phaseBadge = { 'waiting': 'badge-blue', 'action': 'badge-gold', 'meeting': 'badge-green', 'auction': 'badge-gold', 'duel': 'badge-red', 'finished': 'badge-blue' };
            tbody.innerHTML = data.rooms.map(r => `
                <tr>
                    <td style="font-weight:700;color:var(--primary)">${esc(r.id)}</td>
                    <td>${esc(r.name)}</td>
                    <td>${r.player_count}人</td>
                    <td><span class="badge ${phaseBadge[r.phase] || 'badge-blue'}">${phaseLabels[r.phase] || r.phase}</span></td>
                    <td><button class="btn btn-danger" style="padding:4px 12px;font-size:12px" onclick="deleteRoom('${esc(r.id)}')">删除</button></td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无房间</td></tr>';
        }
    } catch (e) {
        document.getElementById('roomTableBody').innerHTML = '<tr><td colspan="5" class="empty-state">加载失败</td></tr>';
    }
}

// 删除用户
async function deleteUser(username) {
    if (!confirm('确定要删除用户 "' + username + '" 吗？此操作不可撤销。')) return;
    try {
        const res = await fetch('/admin/user/' + encodeURIComponent(username) + '/delete', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            loadUsers();
        } else {
            alert(data.message || '删除失败');
        }
    } catch (e) {
        alert('网络错误');
    }
}

// 删除房间
async function deleteRoom(roomId) {
    if (!confirm('确定要删除房间 "' + roomId + '" 吗？此操作不可撤销。')) return;
    try {
        const res = await fetch('/admin/room/' + encodeURIComponent(roomId) + '/delete', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            loadRooms();
        } else {
            alert(data.message || '删除失败');
        }
    } catch (e) {
        alert('网络错误');
    }
}

// 退出登录
function doAdminLogout() {
    document.cookie = 'admin_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    window.location.href = '/admin.html';
}

// HTML转义
function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// 初始化：加载用户列表
loadUsers();
</script>
{% endif %}
</body>
</html>
