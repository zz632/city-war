<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城池战争</title>
    <link rel="stylesheet" href="/static/css/main.css?v=15">
</head>
<body data-page="home">
    <div class="page-wrap">
        <!-- 标题 -->
        <div class="home-header">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6a2 2 0 012-2h2a2 2 0 012 2v6"/>
            </svg>
            <div class="page-title">城池战争</div>
            <div class="page-subtitle">CityWar</div>
        </div>

        <!-- 登录/注册区域（在线模式显示） -->
        <div id="auth-section" class="card" style="display:none">
            <!-- 登录表单 -->
            <div id="auth-login">
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>用户名</span>
                    </label>
                    <input type="text" id="loginUsername" class="field-input" placeholder="输入用户名" maxlength="12" autocomplete="off">
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <span>密码</span>
                    </label>
                    <div class="field-input-wrap">
                        <input type="password" id="loginPassword" class="field-input field-input-pw" placeholder="输入密码" autocomplete="off">
                        <button class="pw-toggle" onclick="togglePw('loginPassword', this)" title="显示/隐藏密码">
                            <svg class="pw-eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="pw-eye-closed" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button id="loginBtn" class="btn btn-primary btn-block btn-lg">
                    <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5"/></svg>
                    <span>登录</span>
                </button>
                <p class="auth-switch">没有账号？<a href="#" id="showRegister">注册一个</a> | <a href="#" onclick="event.preventDefault();openMoreLoginModal()">其他登录方式</a></p>
            </div>
            <!-- 注册表单 -->
            <div id="auth-register" style="display:none">
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>用户名</span>
                    </label>
                    <input type="text" id="regUsername" class="field-input" placeholder="2-12个字符" maxlength="12" autocomplete="off">
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>昵称</span>
                    </label>
                    <input type="text" id="regDisplayName" class="field-input" placeholder="游戏中显示的名字（留空同用户名）" maxlength="12" autocomplete="off">
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <span>密码</span>
                    </label>
                    <div class="field-input-wrap">
                        <input type="password" id="regPassword" class="field-input field-input-pw" placeholder="至少4个字符" autocomplete="off">
                        <button class="pw-toggle" onclick="togglePw('regPassword', this)" title="显示/隐藏密码">
                            <svg class="pw-eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="pw-eye-closed" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <span>确认密码</span>
                    </label>
                    <div class="field-input-wrap">
                        <input type="password" id="regPasswordConfirm" class="field-input field-input-pw" placeholder="再输入一次密码" autocomplete="off">
                        <button class="pw-toggle" onclick="togglePw('regPasswordConfirm', this)" title="显示/隐藏密码">
                            <svg class="pw-eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="pw-eye-closed" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button id="registerBtn" class="btn btn-primary btn-block btn-lg">
                    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
                    <span>注册</span>
                </button>
                <p class="auth-switch">已有账号？<a href="#" id="showLogin">去登录</a></p>
            </div>
        </div>

        <!-- 游戏主卡片（登录后或本地模式显示） -->
        <div id="game-section" class="card" style="display:none">
            <!-- 已登录提示（在线模式） -->
            <div id="logged-in-info" class="logged-in-info" style="display:none">
                <span id="logged-in-name"></span>
                <div class="logged-in-actions">
                    <button id="accountSettingsBtn" class="btn-logout" title="设置" onclick="window.location.href='/settings'">设置</button>
                    <button id="logoutBtn" class="btn-logout" title="退出登录">退出</button>
                </div>
            </div>
            <!-- 玩家名（本地模式） -->
            <div id="local-name-field" class="field">
                <label class="field-label">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>你的名字</span>
                </label>
                <input type="text" id="playerName" class="field-input" placeholder="起一个霸气的名字" maxlength="12" autocomplete="off">
            </div>
            <!-- 房间号（可选） -->
            <div class="field">
                <label class="field-label">
                    <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5"/></svg>
                    <span>房间号（留空则创建新房）</span>
                </label>
                <div class="room-row">
                    <input type="text" id="roomCode" class="field-input" placeholder="输入4位数字房间号" maxlength="4" autocomplete="off" inputmode="numeric">
                </div>
            </div>
            <!-- 进入按钮 -->
            <button id="enterBtn" class="btn btn-primary btn-block btn-lg">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                <span>进入游戏</span>
            </button>
        </div>

        <!-- 底部提示 -->
        <div class="info-row">
            <span class="info-chip">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                2-8人
            </span>
            <span class="info-chip">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                15-30分钟
            </span>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- 更多登录方式弹窗 -->
    <div id="moreLoginModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeMoreLoginModal()">
        <div class="modal-card" style="max-width:360px">
            <div class="modal-header">
                <h3>其他登录方式</h3>
                <button class="modal-close" onclick="closeMoreLoginModal()">&times;</button>
            </div>
            <!-- 第三方登录 -->
            <div id="oauth-section" class="oauth-section">
                <div class="divider"><span>第三方登录</span></div>
                <div class="oauth-btns">
                    <button class="oauth-btn-text" onclick="oauthLogin('github')" style="--c:#e8ecf4">
                        <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><path fill="#e8ecf4" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>GitHub
                    </button>
                    <button class="oauth-btn-text" onclick="oauthLogin('google')" style="--c:#4285F4">
                        <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Google
                    </button>
                    <button class="oauth-btn-text" onclick="oauthLogin('discord')" style="--c:#5865F2">
                            <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><path fill="#5865F2" d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>Discord
                        </button>
                        <button class="oauth-btn-text" onclick="oauthLogin('gitee')" style="--c:#C71D23">
                            <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><path fill="#C71D23" d="M11.984 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.016 0zm6.09 5.333c.328 0 .593.266.593.593v1.482a.594.594 0 01-.593.592H9.774c-.982 0-1.778.796-1.778 1.778v5.926c0 .982.796 1.778 1.778 1.778h4.454c.982 0 1.778-.796 1.778-1.778v-.296a.593.593 0 00-.592-.593h-2.963a.593.593 0 01-.593-.592v-1.482a.593.593 0 01.593-.592h5.925c.328 0 .593.265.593.592v3.408a4 4 0 01-4 4H9.185a4 4 0 01-4-4V9.778a4.444 4.444 0 014.444-4.445h8.445z"/></svg>Gitee
                        </button>
                </div>
            </div>
            <!-- 游客登录 -->
            <div id="guest-entry">
                <div class="divider"><span>或</span></div>
                <div class="field">
                    <label class="field-label">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>游客昵称</span>
                    </label>
                    <input type="text" id="guestName" class="field-input" placeholder="起一个名字即可游玩" maxlength="12" autocomplete="off">
                </div>
                <button id="guestBtn" class="btn btn-secondary btn-block btn-lg">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>游客登录</span>
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/settings.js?v=16"></script>
    <script src="/static/js/main.js?v=10"></script>
</body>
</html>
