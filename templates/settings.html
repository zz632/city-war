<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 城池战争</title>
    <link rel="stylesheet" href="/static/css/main.css?v=15">
    <style>
        /* ===== 设置页面专用样式 ===== */

        /* 顶栏 */
        .sp-topbar {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .sp-back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            margin-right: 8px;
            border-radius: var(--radius-sm);
            color: var(--text);
            transition: background var(--transition-fast);
            display: flex;
            align-items: center;
        }
        .sp-back-btn:hover { background: var(--surface-active); }
        .sp-back-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .sp-topbar-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        /* 主体 */
        .sp-main {
            display: flex;
            min-height: calc(100vh - 49px); /* 减去 topbar */
            background: var(--bg);
        }

        /* ===== 宽屏布局 ===== */
        .sp-main.sp-wide {
            flex-direction: row;
        }

        /* 侧边栏 */
        .sp-sidebar {
            width: 220px;
            min-width: 220px;
            padding: 16px 12px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            overflow-y: auto;
        }
        .sp-sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            transition: all var(--transition-fast);
            margin-bottom: 2px;
        }
        .sp-sidebar-item:hover {
            background: var(--surface-hover);
        }
        .sp-sidebar-item.active {
            background: var(--surface-active);
            font-weight: 600;
        }
        .sp-sidebar-icon {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
            flex-shrink: 0;
        }

        /* 内容区 */
        .sp-content {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            max-width: 600px;
        }

        /* ===== 窄屏布局 ===== */
        .sp-main.sp-narrow {
            flex-direction: column;
        }

        /* 窄屏列表 */
        .sp-narrow-list {
            padding: 8px 16px;
        }
        .sp-narrow-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 2px;
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        .sp-narrow-item:first-child {
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .sp-narrow-item:last-child {
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            margin-bottom: 0;
        }
        .sp-narrow-item:only-child {
            border-radius: var(--radius-sm);
        }
        .sp-narrow-item:hover {
            background: var(--surface-hover);
        }
        .sp-narrow-icon {
            width: 22px;
            height: 22px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 1.6;
            flex-shrink: 0;
        }
        .sp-narrow-label {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
        }
        .sp-narrow-chevron {
            width: 16px;
            height: 16px;
            stroke: var(--text-tertiary);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        /* ===== Section 内容 ===== */
        .sp-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .sp-section-icon {
            width: 24px;
            height: 24px;
            stroke: var(--primary);
            fill: none;
            stroke-width: 1.6;
        }
        .sp-section-header span {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        /* 账号信息 */
        .sp-profile-info {
            margin-bottom: 16px;
        }
        .sp-profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 2px;
            font-size: 15px;
        }
        .sp-profile-row:first-child {
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .sp-profile-row:last-child {
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            margin-bottom: 0;
        }
        .sp-profile-row:only-child {
            border-radius: var(--radius-sm);
        }
        .sp-profile-label {
            color: var(--text-secondary);
        }

        /* 本地模式提示 */
        .sp-local-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .sp-local-msg p {
            margin-top: 12px;
            font-size: 16px;
            font-weight: 500;
        }

        /* 保存按钮 */
        .sp-save-btn {
            margin-top: 20px;
        }

        /* 外观设置组 */
        .sp-settings-group {
            margin-bottom: 20px;
        }
        .sp-settings-group-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 8px;
        }

        /* 预设颜色行 */
        .sp-preset-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        /* RGB 区域 */
        .sp-rgb-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .sp-rgb-preview-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sp-color-preview {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            flex-shrink: 0;
        }
        .sp-color-hex {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .sp-slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sp-slider-label {
            font-size: 12px;
            font-weight: 700;
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }
        .sp-slider-row .ui-slider {
            flex: 1;
        }
        .sp-slider-val {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 28px;
            text-align: right;
            flex-shrink: 0;
        }

        /* 背景图片行 */
        .sp-bg-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        /* ===== 窄屏内容区 ===== */
        .sp-narrow .sp-content {
            padding: 20px 16px;
            max-width: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 767px) {
            .sp-sidebar {
                display: none;
            }
            .sp-content {
                max-width: none;
            }
        }
    </style>
</head>
<body data-page="settings">
    <!-- 顶栏 -->
    <div class="sp-topbar">
        <button class="sp-back-btn" id="spBack" title="返回">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="sp-topbar-title">设置</span>
    </div>

    <!-- 主体 -->
    <div class="sp-main" id="spMain"></div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/settings.js?v=16"></script>
    <script src="/static/js/settings-page.js?v=1"></script>
    <script>
        /* 简易 toast (此页面独立，不引入 main.js) */
        function toast(msg, type) {
            var el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.className = 'toast ' + (type || 'info');
            requestAnimationFrame(function () { el.classList.add('show'); });
            setTimeout(function () { el.classList.remove('show'); }, 2500);
        }

        /* 密码显示/隐藏切换 (同 main.js) */
        function togglePw(inputId, btn) {
            var input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.classList.add('showing');
            } else {
                input.type = 'password';
                btn.classList.remove('showing');
            }
        }
    </script>
</body>
</html>
